<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>감염관리 게임 운영 종료</title>
  <link rel="stylesheet" href="./style.css?v=closed-v1" />
</head>
<body>
  <main class="closedApp" aria-labelledby="closedTitle">
    <section class="closedCard">
      <div class="closedBadge">SRGH Infection Control</div>
      <p class="closedKicker">감염관리 교육 게임 운영 종료</p>
      <h1 id="closedTitle">많은 관심과 사랑을 주셔서<br />감사드립니다</h1>
      <p class="closedMessage">감염병으로부터 사랑의 병원을 지켜라!<br />게임 프로젝트가 종료되었습니다.</p>

      <div class="farewellScene" aria-label="예방이와 지킴이가 감사 인사를 하는 모습">
        <img class="farewellHospital" src="./assets/start_hospital.png" alt="사랑의병원" />
        <div class="mascotGroup mascotLeft">
          <div class="speechBubble">감사합니다!</div>
          <div class="bowStage bowDelayA">
            <img class="farewellMascot cleanMascot" src="./assets/start_clean.png" alt="꾸벅 인사하는 예방이" />
          </div>
          <span class="mascotName">예방이</span>
        </div>
        <div class="mascotGroup mascotRight">
          <div class="speechBubble">또 만나요!</div>
          <div class="bowStage bowDelayB">
            <img class="farewellMascot bubbleMascot" src="./assets/start_bubble.png" alt="꾸벅 인사하는 지킴이" />
          </div>
          <span class="mascotName">지킴이</span>
        </div>
      </div>

      <div class="closedNotice" role="status">
        <strong>게임 참여와 순위 조회가 종료되었습니다.</strong>
        <span>새로운 점수 등록 및 기존 순위 공개는 제공되지 않습니다.</span>
      </div>

      <p class="closedFooter">사랑의병원 감염관리실</p>
    </section>
  </main>
</body>
</html>
